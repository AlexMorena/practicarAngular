<h1>Departamentos</h1>

<form #plantillaform="ngForm">
  <label>Selecciona un departamento</label>
  <select class="form-control" #selectdepartamento name="selectdepartamento">
    @if (departamentos) {
      @for (depart of departamentos; track depart) {
        <option [value]="depart.numero">{{ depart.nombre }}</option>
      }
    }
  </select>
  <button type="button" class="btn btn-primary mt-2" (click)="buscarDepartamento()">Buscar</button>
</form>


<hr>

@if(departamentoSeleccionado) {
    <div class="card p-3 mt-3">
        <h3>Detalles del Departamento</h3>
        <p><b>ID:</b> {{ departamentoSeleccionado.numero }}</p>
        <p><b>Nombre:</b> {{ departamentoSeleccionado.nombre }}</p>
        <p><b>Localidad:</b> {{ departamentoSeleccionado.localidad }}</p>
    </div>
}
